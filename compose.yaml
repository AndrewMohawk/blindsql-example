name: blindsql-example

services:
  web:
    build:
      context: .
      target: runtime
    image: blindsql-example:local
    restart: unless-stopped
    network_mode: bridge
    env_file: .env
    ports:
      - "127.0.0.1:${BLINDSQL_PORT:-8080}:8080"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    pids_limit: 64
    mem_limit: 192m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
